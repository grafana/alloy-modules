---
name: Stale Branches

# yamllint disable-line rule:truthy
on:
  schedule:
    # Run every Monday to Friday at 6:00 AM
    - cron: '0 6 * * 1-5'

permissions:
  issues: write
  contents: write

jobs:
  stale_branches:
    runs-on: ubuntu-latest
    steps:
      - name: Stale Branches
        uses: crs-k/stale-branches@865501af01284d43aef267d4b9aab0f9f1734b12 # v8.2.2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-delete: 90
          comment-updates: true
          tag-committer: true
